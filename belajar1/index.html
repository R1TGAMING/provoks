<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Profil Saya</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1 class="title">Rafi Sofyan Triyanto</h1>
      <p class="description">Provoks 2026</p>
      <p>Halo saya sedang belajar HTML dan CSS untuk menjadi web developer</p>

      <!-- Logo -->
      <svg
        class="logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        style="margin-top: 8px; opacity: 0.8"
      >
        <circle cx="50" cy="50" r="40" fill="#c92a2a" />
        <text
          x="50"
          y="55"
          font-size="30"
          text-anchor="middle"
          fill="white"
          font-family="sans-serif"
        >
          R
        </text>
      </svg>
    </div>

    <div class="skills-container">
      <div class="skill-card">
        <img
          src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
          alt="HTML5 Logo"
        />
        <span>HTML</span>
        <p class="skill-desc">Bahasa markup untuk struktur halaman web</p>
      </div>

      <div class="skill-card">
        <img
          src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
          alt="CSS3 Logo"
        />
        <span>CSS</span>
        <p class="skill-desc">Bahasa styling dan tampilan halaman web</p>
      </div>

      <div class="skill-card">
        <img
          src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg"
          alt="Git Logo"
        />
        <span>GIT</span>
        <p class="skill-desc">
          Sistem kontrol versi untuk mengelola perubahan kode
        </p>
      </div>

    <a
      href="https://www.instagram.com/ipiilolz?dlrf=MXJlaGFjc2RvcWdzMw=="
